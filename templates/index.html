<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduGenie</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
<header><small>AI-POWERED LEARNING ASSISTANT</small><h1>EduGenie</h1>
<p>Ask questions, learn concepts, create quizzes, summarize lessons and build learning paths.</p></header>
<section>
<label>Choose a task</label>
<select id="task">
<option value="qa">Q&A</option><option value="explain">Explain</option>
<option value="quiz">Quiz</option><option value="summarize">Summary</option>
<option value="learn">Learning Path</option>
</select>
<label>Your input</label>
<textarea id="input" placeholder="Enter your question or learning material..."></textarea>
<button id="go">Generate</button><p id="status"></p>
</section>
<section id="output" hidden><h2>Result</h2><div id="result"></div></section>
</main>
<script src="/static/app.js"></script>
</body></html>
